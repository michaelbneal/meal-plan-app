# Runs the Meal Maker API in a container with a persistent sales cache.
#   docker compose up -d --build
#   curl http://localhost:3001/api/health
services:
  api:
    build: ./backend
    image: meal-maker-api
    container_name: meal-maker-api
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      CACHE_DIR: /data
      DEFAULT_ZIP: "64683"
      APP_VERSION: "1.0.0"
      # CORS_ORIGIN: "capacitor://localhost"
    volumes:
      - sales_cache:/data
    restart: unless-stopped

volumes:
  sales_cache:
